readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotmap>=1.3.30",
    "einops>=0.8.1",
    "kornia>=0.8.1",
    "matplotlib>=3.10.6",
    "numpy>=2.3.2",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.2",
    "pytorch-optimizer>=3.8.0",
    "pyyaml>=6.0.2",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.19",
    "torch>=2.8.0",
    "torcheval>=0.0.7",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
]
